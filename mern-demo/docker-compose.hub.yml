services:
  backend:
    image: trinhhoangdinh/mern-backend:1.0
    container_name: mern-backend
    ports:
      - "5001:5000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
    networks:
      - mern-network

  frontend:
    image: trinhhoangdinh/mern-frontend:2.0
    container_name: mern-frontend
    ports:
      - "8080:4173"
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge
